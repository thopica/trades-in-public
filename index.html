<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Trades Tracker - US Insider Trades</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 p-4 sm:p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">Public Trades Tracker</h1>
      <button id="refreshBtn"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium flex items-center justify-center gap-2 self-start sm:self-auto">
        <span aria-hidden="true">&#128260;</span> Refresh Latest Trades
      </button>
    </div>

    <div id="status" class="mb-4 text-sm text-gray-500" role="status" aria-live="polite"></div>

    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full min-w-[900px]" id="tradesTable">
        <thead class="bg-gray-100">
          <tr>
            <th>Date</th>
            <th>Ticker</th>
            <th>Company</th>
            <th>Insider</th>
            <th>Title</th>
            <th>Type</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Value ($)</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="text-sm"></tbody>
      </table>
    </div>

    <p class="text-xs text-gray-400 mt-6 text-center">
      Data sourced from OpenInsider (SEC Form 4 filings). Provided for informational and
      educational purposes only &mdash; not investment advice. Verify against official SEC EDGAR
      filings before making decisions.
    </p>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
